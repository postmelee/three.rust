name: correctness
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: correctness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      RTHREE_RESULTS_DIR: work/ci-correctness
      RTHREE_DEMO_RESULTS_DIR: work/ci-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: echo "CHROMIUM=$(node --input-type=module -e 'import {chromium} from "playwright"; console.log(chromium.executablePath())')" >> "$GITHUB_ENV"
      - run: npm run docs:check && npm run test:infra
      - run: npm run test:progress
      - run: npm run bundle:status && npm run test:status
      - run: npm run fixtures
      - run: cargo fmt --check && cargo clippy --all-targets -- -D warnings
      - run: npm run build && npm test
      - run: npm run test:facade
      - run: npm run test:compatibility
      - run: npm run test:owned
      - run: npm run test:browser-path && npm run test:fox
      - run: npm run test:timing
      - run: npm run test:pipeline
      - run: npm run test:browser && npm run test:gpu-guard
      - run: npm run test:package && npm run test:demo
      - run: node bench/owned.mjs repeats=1 warmup=5 samples=10 cases=animated-1,static-1 variants=original,owned-js,owned-wasm out=work/owned-smoke
      - run: npm run bench:smoke
      - run: npm run bundle:demo && npm run test:bundle
      - run: mkdir -p dist/package && npm pack ./packages/rthree --pack-destination dist/package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correctness-and-diagnostic-only
          path: |
            work/ci-correctness
            work/ci-demo
            work/compatibility-node
            work/compatibility-browser
            work/package
            work/gpu-guard
            work/fox-rejections
            work/fox-validation
            work/owned-validation
            work/owned-smoke
            work/pipeline-validation
            work/progress-validation
            work/status-site-validation
            work/bundle-validation
            work/bundle-owned
            work/bundle-pipeline
            work/bundle-progress
            work/bench-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: portable-demo-and-local-package
          path: dist
