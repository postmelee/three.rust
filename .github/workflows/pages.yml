name: public status pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: status-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run docs:check
      - run: python3 tools/status_site.py work/status-site --main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: work/status-site
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # First-time activation is a repository administrator setting; this token
      # intentionally does not request/bypass Administration permission.
      - uses: actions/configure-pages@v5
      - name: Deploy reviewed status artifact
        id: deployment
        uses: actions/deploy-pages@v4
